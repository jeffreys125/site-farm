# =============================================================================
# Apache 泛二级域名配置（宝塔 Windows / Linux 通用）
#
# 用途：让 *.example.com 全部指向同一套目录，每个子域一个独立 WordPress：
#   C:/www/wwwroot/example.com/sites/diy
#   C:/www/wwwroot/example.com/sites/pet
#   ...
#
# 为什么不用 WordPress Multisite：
#   Multisite 在 Google 眼里是一个实体，任何一个子站被人工处罚，
#   整张网络都会掉权重。独立安装 = 风险隔离，这是站群能活下来的前提。
#
# 放置位置（宝塔 Windows）：C:\BtSoft\apache\conf\vhost\000-wildcard.conf
# 放置位置（宝塔 Linux）  ：/www/server/panel/vhost/apache/000-wildcard.conf
# =============================================================================

# --- 前置：确认 httpd.conf 里这两行没有被注释 -------------------------------
# LoadModule vhost_alias_module modules/mod_vhost_alias.so
# LoadModule rewrite_module     modules/mod_rewrite.so

<VirtualHost *:80>
    ServerName   example.com
    ServerAlias  www.example.com
    ServerAlias  *.example.com

    # %1 = 完整子域名（diy / pet / camp ...），每个子站一个独立目录
    VirtualDocumentRoot "C:/www/wwwroot/example.com/sites/%1"
    VirtualDocumentRootIP "C:/www/wwwroot/example.com/sites/%1"

    <Directory "C:/www/wwwroot/example.com/sites">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # WordPress REST API 走 Basic Auth，某些 Apache 版本会吞掉 Authorization 头
    # 没有这一行，Application Password 会一直 401
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # 强制跳转 HTTPS（证书签发完成后再取消注释）
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteCond %{REQUEST_URI} !^/\.well-known/
    # RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog  "C:/BtSoft/apache/logs/wildcard-error.log"
    CustomLog "C:/BtSoft/apache/logs/wildcard-access.log" combined
</VirtualHost>

<VirtualHost *:443>
    ServerName   example.com
    ServerAlias  www.example.com
    ServerAlias  *.example.com

    VirtualDocumentRoot "C:/www/wwwroot/example.com/sites/%1"

    # 通配符证书（Let's Encrypt 泛域名必须用 DNS-01 验证，宝塔面板可直接申请）
    SSLEngine on
    SSLCertificateFile    "C:/www/server/panel/vhost/cert/example.com/fullchain.pem"
    SSLCertificateKeyFile "C:/www/server/panel/vhost/cert/example.com/privkey.pem"
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256

    <Directory "C:/www/wwwroot/example.com/sites">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # --- 性能：静态资源缓存 + 压缩 ------------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/webp  "access plus 1 year"
        ExpiresByType image/jpeg  "access plus 1 year"
        ExpiresByType text/css    "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
    </IfModule>

    # --- 安全头 -------------------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  "C:/BtSoft/apache/logs/wildcard-ssl-error.log"
    CustomLog "C:/BtSoft/apache/logs/wildcard-ssl-access.log" combined
</VirtualHost>

# =============================================================================
# 备选方案：不用 mod_vhost_alias，在宝塔面板里逐个添加站点
#
# 面板 → 网站 → 添加站点，域名填 diy.example.com，
# 根目录选 C:/www/wwwroot/example.com/sites/diy，PHP 版本保持一致。
# 8 个站就是重复 8 次，好处是每个站可以单独分配 PHP 版本、缓存策略和证书。
# =============================================================================

