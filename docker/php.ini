; =============================================================================
; PHP tuning for a small content site network.
; Sized for 8 low-traffic WordPress installs sharing one PHP process pool.
; =============================================================================

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; WordPress runs fine with opcache once the site is warm; this is the single
; biggest speed win on a small VPS.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.validate_timestamps = 1

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC
