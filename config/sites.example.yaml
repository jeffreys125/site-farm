# ---------------------------------------------------------------------------
# Site-farm configuration
#
# Copy this file to config/sites.yaml and edit it. Everything here is data:
# the pipeline code never needs to change when you add a site.
#
# Secrets and the AI endpoint are read from environment variables first, so
# they never have to live in this file:
#   LLM_PROVIDER, LLM_API_KEY, LLM_BASE_URL, LLM_MODEL, LLM_THINKING,
#   LLM_MAX_TOKENS, DEEPSEEK_API_KEY, INDEXNOW_KEY,
#   WP_APP_PASSWORD_<SITEID_UPPERCASE>
# ---------------------------------------------------------------------------

project:
  brand: "Northline Media"
  contact_email: "editor@example.com"

  # Key name stays `deepseek` for backwards compatibility (the renderer in
  # docker/pipeline-entrypoint.sh guards this path when rewriting URLs).
  # This section now configures any OpenAI-compatible provider; values in
  # .env win. For a non-DeepSeek provider set LLM_PROVIDER / LLM_BASE_URL /
  # LLM_MODEL in .env -- the endpoint defaults below are then ignored.
  deepseek:
    api_key: ""                       # prefer LLM_API_KEY / DEEPSEEK_API_KEY
    base_url: "https://api.deepseek.com"
    model: "deepseek-chat"
    temperature: 0.75
    max_tokens: 8192
    requests_per_minute: 40

  paths:
    data_dir: "data"
    output_dir: "output"

  indexnow_key: ""                    # 32-64 hex chars, generate one per project
  bing_api_key: ""
  google_sa_json: ""

sites:
  # =========================================================================
  # 1. DIY / home repair - highest commercial intent, strong affiliate payouts
  # =========================================================================
  - id: diy
    domain: "example.com"
    base_url: "https://diy.example.com"
    niche: "home repair, renovation and DIY projects"
    audience: "US and UK homeowners aged 30-60 tackling weekend projects themselves"
    tone: "practical, hands-on, mildly opinionated"
    currency: "USD"
    per_day: 3
    min_words: 1400
    max_words: 2000
    affiliate_tag: "northline-20"
    hub_url: "https://example.com"
    siblings: [woodworking, garden, homeoffice]
    categories: ["Guides", "Plumbing", "Electrical", "Painting", "Flooring", "Insulation"]
    topic_seeds:
      - "fixing common household problems"
      - "renovation cost breakdowns"
      - "weekend DIY projects"
      - "tools a beginner actually needs"
    disclosure: "Links marked with a tag may earn us a commission. It never changes what we recommend."
    sources:
      - url: "https://www.consumerfinance.gov/about-us/newsroom/feed/"
        name: "CFPB newsroom"
        kind: rss
        license: public-domain
      - url: "https://www.energy.gov/rss/press-releases"
        name: "US DOE"
        kind: rss
        license: public-domain
    wp:
      user: "editor"
      app_password: ""
      status: "draft"
      default_category: "Guides"

  # =========================================================================
  # 2. Woodworking - small but fanatical audience, high tool AOV
  # =========================================================================
  - id: woodworking
    domain: "example.com"
    base_url: "https://woodworking.example.com"
