    audience: "hobbyist woodworkers with a garage shop and 2-5 years of experience"
    tone: "craftsman-to-craftsman, precise about measurements"
    currency: "USD"
    per_day: 2
    min_words: 1300
    max_words: 1900
    affiliate_tag: "northline-20"
    hub_url: "https://example.com"
    siblings: [diy, homeoffice]
    categories: ["Techniques", "Joinery", "Tool Reviews", "Shop Setup", "Finishing"]
    topic_seeds:
      - "joinery methods compared"
      - "workshop layout for small spaces"
      - "sharpening and tuning hand tools"
      - "wood species selection"
    sources:
      - url: "https://www.nist.gov/news-events/news/rss.xml"
        name: "NIST"
        kind: rss
        license: public-domain
    wp:
      user: "editor"
